# XcodeGen spec. Regenerate the project after adding files:  cd ios && xcodegen
name: Apricot
options:
  bundleIdPrefix: dev.apricot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Apricot:
    type: application
    platform: iOS
    sources:
      - path: Apricot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.apricot.app
        PRODUCT_NAME: Apricot
        INFOPLIST_FILE: Apricot/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team here (or pick it in Xcode > Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
