name: Release

# Push a tag like v0.1.0 to publish a GitHub release with an unsigned IPA.
# Windows and Linux users can't run Xcode, so they sideload this IPA with Sideloadly or AltStore,
# which sign it with their own Apple ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        working-directory: ios
        run: |
          xcodebuild -project Apricot.xcodeproj -scheme Apricot -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Apricot.app Payload/
          zip -qry Apricot-unsigned.ipa Payload
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apricot-unsigned-ipa
          path: ios/Apricot-unsigned.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ios/Apricot-unsigned.ipa
            examples/hello-apricot/hello-apricot.apk
